name: Sync and Convert to Shadowrocket

on:
  schedule:
    # 每天北京时间 08:00 自动运行（UTC 00:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4

      - name: 浅克隆 Moli-X/Resources 源仓库
        run: |
          git clone --depth=1 https://github.com/Moli-X/Resources.git upstream_repo

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行批量转换脚本
        run: |
          python3 scripts/convert.py

      - name: 清理临时源仓库
        run: |
          rm -rf upstream_repo

      - name: 提交并推送转换结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add Shadowrocket/
          if git diff --staged --quiet; then
            echo "没有检测到模块更新，跳过提交。"
          else
            git commit -m "chore: sync and convert modules $(date +'%Y-%m-%d')"
            git push
          fi
